# Used only for the downloadable iPhone testing package. No Gradle build on the user's Mac.
name: OpenTabs
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTED_PLATFORMS: iphoneos
targets:
  OpenTabs:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - framework: Frameworks/OpenTabsCore.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opentabs.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  OpenTabs:
    build:
      targets:
        OpenTabs: all
