name: OpenTabs
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  OpenTabs:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opentabs.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS: '$(inherited) -framework OpenTabsCore'
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode -PiosOnly=true
  OpenTabsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OpenTabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opentabs.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenTabs:
    build:
      targets:
        OpenTabs: all
        OpenTabsUITests: [test]
    test:
      targets: [OpenTabsUITests]
